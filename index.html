<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cake Craft</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0f766e;
      --primary-hover: #0d5e58;
      --primary-soft: rgba(15, 118, 110, 0.14);
      --primary-border: rgba(15, 118, 110, 0.34);
      --primary-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #d8e3ed;
      background-image:
        radial-gradient(at 10% 12%, rgba(15, 118, 110, 0.22) 0px, transparent 52%),
        radial-gradient(at 90% 15%, rgba(56, 189, 248, 0.22) 0px, transparent 50%),
        radial-gradient(at 45% 92%, rgba(245, 158, 11, 0.16) 0px, transparent 56%);
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    body.lang-bn {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
    }

    .font-num {
      font-variant-numeric: tabular-nums;
    }

    .theme-bg {
      background-color: var(--primary) !important;
      color: var(--primary-text) !important;
    }

    .theme-bg-hover:hover {
      background-color: var(--primary-hover) !important;
    }

    .theme-text {
      color: var(--primary) !important;
    }

    .theme-border {
      border-color: var(--primary) !important;
    }

    .theme-soft {
      background-color: var(--primary-soft) !important;
      color: var(--primary) !important;
    }

    .theme-soft-border {
      border-color: var(--primary-border) !important;
    }

    /* Glassmorphism 2.0 Surfaces */
    .glass-bar {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(24px) saturate(185%);
      -webkit-backdrop-filter: blur(24px) saturate(185%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 6px 26px -6px rgba(15, 23, 42, 0.08);
    }

    .glass-frame {
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.78) 0%,
        rgba(241, 245, 249, 0.74) 100%
      );
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 10px 28px -8px rgba(15, 23, 42, 0.08),
        0 2px 6px -1px rgba(15, 23, 42, 0.04),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.92);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px) saturate(175%);
      -webkit-backdrop-filter: blur(16px) saturate(175%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 4px 14px -4px rgba(15, 23, 42, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.88);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
      transition: all 0.18s ease;
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.94);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft), inset 0 1px 2px rgba(15, 23, 42, 0.02);
      outline: none;
    }

    .glass-modal {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow:
        0 28px 65px -15px rgba(15, 23, 42, 0.25),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.96);
    }

    /* Fixed Split Floating Dark Glass Pill Navigation */
    .nav-dock-outer {
      background: rgba(16, 17, 22, 0.86);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      box-shadow:
        0 20px 44px -10px rgba(0, 0, 0, 0.48),
        0 0 0 1px rgba(255, 255, 255, 0.14),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.2);
    }

    .nav-capsule-inner {
      background: linear-gradient(180deg, rgba(46, 48, 58, 0.84) 0%, rgba(26, 27, 33, 0.92) 100%);
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.14),
        0 4px 14px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-circle-btn {
      background: rgba(56, 58, 70, 0.78);
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.16),
        0 2px 8px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .phone-chassis {
      box-shadow:
        0 34px 78px -18px rgba(15, 23, 42, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.75),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.92);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view {
      animation: slideUpFade 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Slender Luxury Candle Flame, Halo & Wisp Animations */
    @keyframes luxuryFlameFlicker {
      0%, 100% { transform: scale(1, 1) rotate(-2deg); opacity: 0.96; }
      33% { transform: scale(1.07, 0.95) rotate(1.8deg); opacity: 1; }
      66% { transform: scale(0.96, 1.06) rotate(-1.4deg); opacity: 0.94; }
    }
    .luxury-flame-lit {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: luxuryFlameFlicker 0.3s ease-in-out infinite;
    }

    @keyframes candleSmokeWisp {
      0% { opacity: 0.72; transform: translateY(0px) translateX(0px) scale(0.6); }
      55% { opacity: 0.38; transform: translateY(-15px) translateX(4px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-28px) translateX(-3px) scale(1.45); }
    }
    .candle-smoke-wisp {
      transform-box: fill-box;
      transform-origin: center;
      animation: candleSmokeWisp 1.2s ease-out forwards;
    }

    @keyframes cakeFloatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .cake-hero-float {
      animation: cakeFloatGentle 4.2s ease-in-out infinite;
    }

    .patisserie-stage-dark {
      background:
        radial-gradient(ellipse 90% 55% at 50% 42%, rgba(212, 175, 55, 0.07) 0%, transparent 62%),
        linear-gradient(180deg, #12141b 0%, #0d0f14 55%, #07080b 100%);
    }

    .patisserie-stage-lit {
      background:
        radial-gradient(ellipse 115% 65% at 50% 44%, rgba(251, 191, 36, 0.25) 0%, rgba(245, 158, 11, 0.08) 48%, transparent 75%),
        radial-gradient(circle at 50% 24%, rgba(253, 224, 71, 0.14) 0%, transparent 55%),
        linear-gradient(180deg, #171923 0%, #11131a 55%, #090a0e 100%);
    }
  #app-switcher { display: none !important; }
  </style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYe_zWnhO9Fk34QkQar3KTu-DGt7dWYE8",
    authDomain: "cack-craft-mehedi.firebaseapp.com",
    projectId: "cack-craft-mehedi",
    storageBucket: "cack-craft-mehedi.firebasestorage.app",
    messagingSenderId: "660148427966",
    appId: "1:660148427966:web:c152f535eaae2bea4ed2ef",
    measurementId: "G-X84BGC9W0X"
  };

  window.firebaseReady = false;
  window.firebaseInitError = null;

  try {
    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    window.firebaseAPI = {
      createAccount: async ({ email, password, name, role = "customer", profile = {} }) => {
        const cleanEmail = (email || "").trim();
        const cleanName = (name || "").trim();

        const credential = await createUserWithEmailAndPassword(auth, cleanEmail, password);
        const user = credential.user;

        if (cleanName) {
          await updateProfile(user, { displayName: cleanName });
        }

        const userDocData = {
          uid: user.uid,
          email: user.email || cleanEmail,
          name: cleanName,
          role,
          profile,
          createdAt: serverTimestamp()
        };

        await setDoc(doc(db, "users", user.uid), userDocData);

        return {
          uid: user.uid,
          email: user.email || cleanEmail,
          name: cleanName,
          role,
          profile
        };
      },

      login: async (email, password) => {
        const cleanEmail = (email || "").trim();
        const credential = await signInWithEmailAndPassword(auth, cleanEmail, password);
        const user = credential.user;

        let profileData = {};
        try {
          const profileSnap = await getDoc(doc(db, "users", user.uid));
          if (profileSnap.exists()) {
            profileData = profileSnap.data() || {};
          }
        } catch (profileError) {
          console.warn("User profile fetch failed:", profileError);
        }

        return {
          uid: user.uid,
          email: user.email || cleanEmail,
          name: user.displayName || profileData.name || "",
          role: profileData.role || null,
          profile: profileData.profile || {}
        };
      },

      logout: async () => {
        await signOut(auth);
        return true;
      }
    };

    window.firebaseReady = true;
  } catch (error) {
    console.error("Firebase initialization failed:", error);
    window.firebaseReady = false;
    window.firebaseInitError = error;
  }
</script>

    function playCandleSound(mode) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        if (mode === 'ignite') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(540, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1180, ctx.currentTime + 0.085);
          gain.gain.setValueAtTime(0.14, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.095);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(105, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.23);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.24);
        }
      } catch {}
    }

    function applyThemeColor() {
      const hex = appState.shopSettings.themeColor || '#0f766e';
      document.documentElement.style.setProperty('--primary', hex);
      document.documentElement.style.setProperty('--primary-hover', shadeHexColor(hex, -14));
      document.documentElement.style.setProperty('--primary-soft', hexToRgba(hex, 0.14));
      document.documentElement.style.setProperty('--primary-border', hexToRgba(hex, 0.34));
    }

    function shadeHexColor(hex, percent) {
      try {
        let clean = hex.replace('#', '');
        if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
        const num = parseInt(clean, 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.max(0, Math.min(255, (num >> 16) + amt));
        const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
        const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
        return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
      } catch {
        return hex;
      }
    }

    function hexToRgba(hex, alpha) {
      try {
        let clean = hex.replace('#', '');
        if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
        const num = parseInt(clean, 16);
        const R = (num >> 16) & 255;
        const G = (num >> 8) & 255;
        const B = num & 255;
        return `rgba(${R}, ${G}, ${B}, ${alpha})`;
      } catch {
        return 'rgba(15, 118, 110, 0.14)';
      }
    }

    async function handleSignUpSubmit(e, appName) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim().toLowerCase();
      const phone = document.getElementById('signup-phone').value.trim();
      const password = document.getElementById('signup-password').value;
      const address = document.getElementById('signup-address').value.trim();
      if (!window.firebaseReady || !window.firebaseAPI) {
        showToast('Firebase চালু হয়নি। ইন্টারনেট ও Firebase সেটিংস পরীক্ষা করুন।', 'error');
        return;
      }
      const shopNameInput = document.getElementById('signup-shopname');
      const shopName = appName === 'shopkeeper' && shopNameInput ? shopNameInput.value.trim() : '';
      try {
        const account = await window.firebaseAPI.createAccount({
          email, password, name, role: appName,
          profile: { phone, address, shopName: shopName || null }
        });
        if (shopName) appState.shopSettings.shopName = shopName;
        appState.auth[appName] = {
          signedUp: true, loggedIn: false,
          user: { uid: account.uid, email, name, phone, address, avatar: appName === 'shopkeeper' ? DEFAULT_IMAGES.avatarAdmin : DEFAULT_IMAGES.avatarCustomer }
        };
        authViewOverride = 'login';
        saveState();
        showToast('Firebase-এ অ্যাকাউন্ট তৈরি হয়েছে', 'success');
        renderApp();
      } catch (error) {
        console.error(error);
        const messages = {
          'auth/email-already-in-use': 'এই ইমেইল দিয়ে আগে থেকেই অ্যাকাউন্ট আছে।',
          'auth/invalid-email': 'সঠিক ইমেইল লিখুন।',
          'auth/weak-password': 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।',
          'auth/operation-not-allowed': 'Firebase Console থেকে Email/Password sign-in চালু করুন।'
        };
        showToast(messages[error.code] || error.message || 'সাইন আপ করা যায়নি।', 'error');
      }
    }

    async function handleLoginSubmit(e, appName) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      if (!window.firebaseReady || !window.firebaseAPI) {
        showToast('Firebase চালু হয়নি। ইন্টারনেট ও Firebase সেটিংস পরীক্ষা করুন।', 'error');
        return;
      }
      try {
        const account = await window.firebaseAPI.login(email, password);
        if (account.role && account.role !== appName) {
          await window.firebaseAPI.logout();
          showToast('এই অ্যাকাউন্টটি অন্য অ্যাপের জন্য নিবন্ধিত।', 'error');
          return;
        }
        const localUser = appState.auth[appName].user || {};
        appState.auth[appName] = {
          ...appState.auth[appName], signedUp: true, loggedIn: true,
          user: { ...localUser, uid: account.uid, email: account.email, name: account.name || localUser.name }
        };
        if (appName === 'customer') {
          appState.customerIntroPending = true;
          appState.activeTab.customer = 'home';
        } else {
          appState.activeTab.shopkeeper = 'home';
        }
        saveState();
        showToast(L('Login'), 'success');
        renderApp();
      } catch (error) {
        console.error(error);
        const messages = {
          'auth/invalid-credential': 'ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।',
          'auth/user-not-found': 'এই ইমেইলে কোনো অ্যাকাউন্ট পাওয়া যায়নি।',
          'auth/wrong-password': 'পাসওয়ার্ড সঠিক নয়।',
          'auth/too-many-requests': 'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।'
        };
        showToast(messages[error.code] || 'লগইন করা যায়নি: ' + (error.message || ''), 'error');
      }
    }

    function resetAuthToSignUp(appName) {
      appState.auth[appName].signedUp = false;
      appState.auth[appName].loggedIn = false;
      authViewOverride = 'signup';
      saveState();
      renderApp();

    async function logoutApp(appName) {
      try { if (window.firebaseAPI) await window.firebaseAPI.logout(); } catch (error) { console.warn(error); }
      appState.auth[appName].loggedIn = false;
      appState.menuSubView[appName] = 'main';
      authCandlesLit = false;
      authSmokeActive = false;
      authViewOverride = null;
      saveState();
      showToast(L('Logout'), 'info');
      renderApp();
    }

    function startPortraitIntroVideoAutoplay() {
      setTimeout(() => {
        const vid = document.getElementById('customer-intro-video');
        const soundLabel = document.getElementById('intro-sound-label');
        if (!vid) return;

        vid.muted = false;
        const promise = vid.play();
        if (promise !== undefined) {
          promise
            .then(() => {
              if (soundLabel) soundLabel.textContent = L('Sound On');
            })
            .catch(() => {
              vid.muted = true;
              vid.play().catch(() => {});
              if (soundLabel) soundLabel.textContent = L('Tap for Sound');
            });
        }
      }, 40);
    }

    function toggleIntroVideoSound() {
      const vid = document.getElementById('customer-intro-video');
      const soundLabel = document.getElementById('intro-sound-label');
      if (!vid) return;
      vid.muted = !vid.muted;
      if (vid.paused) vid.play().catch(() => {});
      if (soundLabel) {
        soundLabel.textContent = L(vid.muted ? 'Tap for Sound' : 'Sound On');
      }
    }

    function finishCustomerIntro() {
      const vid = document.getElementById('customer-intro-video');
      if (vid) {
        try { vid.pause(); } catch {}
      }
      appState.customerIntroPending = false;
      appState.activeTab.customer = 'home';
      saveState();
      renderApp();
    }

              ${actionBtn.active ? actionBtn.iconActive : actionBtn.iconInactive}

      appState.activeTab.shopkeeper = tabId;
      if (tabId === 'menu') appState.menuSubView.shopkeeper = 'main';
      saveState();
      renderApp();

      if (tab === 'messages') return renderShopkeeperMessagesScreen();

    function handleCreateCategory(e) {
      e.preventDefault();
      const name = document.getElementById('new-category-name').value.trim();
      if (!name) return;

      const exists = appState.categories.some(c => c.name.toLowerCase() === name.toLowerCase());
      if (exists) {
        showToast(L('Category Name'), 'error');
        return;
      }

      const lower = name.toLowerCase();
      appState.categories.push({
        id: 'cat-' + Date.now(),
        name,
        isDefaultCake: lower === 'cake' || name === 'কেক'
      });
      saveState();
      closeModal();
      renderApp();
      showToast(L('Create'), 'success');
    }

          images: [DEFAULT_IMAGES.cake1],

          price: 950,
          stock: 15
        }
      });

      renderProductFormModal({

    function renderPricingStockFields(isCakeCat, unitType, price, stock) {
      if (isCakeCat) {
        return `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold theme-text flex items-center gap-1.5">
              ${ICONS.cake}

            <input type="hidden" id="prod-unit-type" value="pound" />

            <input
              id="prod-price"
              type="number"
              min="1"
              step="any"
              required
              value="${price || 950}"
              class="w-full px-3.5 py-2 rounded-xl glass-input text-sm font-num font-bold"
            />
          </div>
          <input id="prod-stock" type="hidden" value="0" />
        `;
      }

      const validUnit = (unitType === 'gram' || unitType === 'piece') ? unitType : 'piece';
      return `
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">${escapeHtml(L('Unit Type'))}</label>
          <select
            id="prod-unit-type"
            class="w-full px-3 py-2 rounded-xl glass-input text-sm font-semibold"
          >
            <option value="piece" ${validUnit === 'piece' ? 'selected' : ''}>${escapeHtml(L('Piece'))}</option>
            <option value="gram" ${validUnit === 'gram' ? 'selected' : ''}>${escapeHtml(L('Gram'))}</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">${escapeHtml(L('Price (৳)'))}</label>
            <input
              id="prod-price"
              type="number"
              min="0.1"
              step="any"
              required
              value="${price || 50}"
              class="w-full px-3 py-2 rounded-xl glass-input text-sm font-num font-bold"
            />
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">${escapeHtml(L('Stock'))}</label>
            <input
              id="prod-stock"
              type="number"
              min="0"
              step="1"
              required
              value="${stock ?? 10}"
              class="w-full px-3 py-2 rounded-xl glass-input text-sm font-num font-bold"
            />
          </div>
        </div>
      `;
    }

    function onProductModalCategoryChange() {
      const catId = document.getElementById('prod-category').value;
      const catObj = appState.categories.find(c => c.id === catId);
      const isCake = isCakeCategoryObj(catObj);
      const currentPrice = document.getElementById('prod-price')?.value || (isCake ? 950 : 50);
      const currentStock = document.getElementById('prod-stock')?.value || 10;
      const currentUnit = document.getElementById('prod-unit-type')?.value || 'piece';

      document.getElementById('prod-pricing-stock-box').innerHTML = renderPricingStockFields(
        isCake,
        isCake ? 'pound' : currentUnit,
        currentPrice,

    function handleProductImageUpload(e) {
      const files = Array.from(e.target.files || []);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') {
            modalTempImages.push(reader.result);
            const container = document.getElementById('modal-images-preview');
            if (container) container.innerHTML = renderModalImagesList();
          }
        };
        reader.readAsDataURL(file);

    function handleSaveProduct(e, mode, existingId) {
      e.preventDefault();
      const categoryId = document.getElementById('prod-category').value;
      const catObj = appState.categories.find(c => c.id === categoryId);
      const isCake = isCakeCategoryObj(catObj);

      const name = document.getElementById('prod-name').value.trim();
      const description = document.getElementById('prod-desc').value.trim();
      const unitType = isCake ? 'pound' : document.getElementById('prod-unit-type').value;
      const price = parseFloat(document.getElementById('prod-price').value);
      const stock = isCake ? 0 : parseInt(document.getElementById('prod-stock').value || '0', 10);

      if (!name || isNaN(price) || price <= 0) {
        showToast(L('Product Name'), 'error');
        return;
      }

      const finalImages = modalTempImages.length > 0 ? [...modalTempImages] : [DEFAULT_IMAGES.placeholder];

      if (mode === 'add') {
        appState.products.unshift({
          id: 'prod-' + Date.now(),
          categoryId,
          name,
          description,
          images: finalImages,
          unitType,
          price,
          stock
        });
        showToast(L('Add Product'), 'success');
      } else {
        const idx = appState.products.findIndex(p => p.id === existingId);
        if (idx !== -1) {
          appState.products[idx] = {
            ...appState.products[idx],
            categoryId,
            name,
            description,
            images: finalImages,
            unitType,
            price,
            stock
          };
          showToast(L('Edit Product'), 'success');
        }
      }

      saveState();
      closeModal();
      renderApp();
    }

    function handleDeleteProduct(productId) {
      appState.products = appState.products.filter(p => p.id !== productId);
      appState.cart = appState.cart.filter(c => c.productId !== productId);
      saveState();
      closeModal();
      renderApp();
      showToast(L('Delete'), 'info');
    }

    function buildWhatsAppProductUrl(product, categoryName) {
      const cleanNumber = (appState.shopSettings.whatsappNumber || '8801711000000').replace(/[^\d]/g, '');
      const photoLink = (product.images && product.images[0]) ? product.images[0] : '';
      const pName = L(product.name);
      const pDesc = L(product.description || '');
      const text = appState.lang === 'bn'
        ? [
            `আসসালামু আলাইকুম, আমি এই পণ্যটি সম্পর্কে জানতে চাই:`,
            `• পণ্য: ${pName}`,
            `• ক্যাটাগরি: ${categoryName}`,
            `• মূল্য: ${product.price} টাকা (${formatUnitLabel(product.unitType)})`,
            `• বিবরণ: ${pDesc}`,
            photoLink ? `• ছবির লিংক: ${photoLink}` : ''
          ].filter(Boolean).join('\n')
        : [
            `Hello, I would like to know more about this product:`,
            `• Product: ${pName}`,
            `• Category: ${categoryName}`,
            `• Price: ${product.price} BDT (${formatUnitLabel(product.unitType)})`,
            `• Details: ${pDesc}`,
            photoLink ? `• Photo Link: ${photoLink}` : ''
          ].filter(Boolean).join('\n');

      return `https://wa.me/${cleanNumber}?text=${encodeURIComponent(text)}`;
    }

    function addProductToCartWithStockCheck(productId, deltaQty) {
      const prod = appState.products.find(p => p.id === productId);
      if (!prod) return { ok: false, error: L('No products found') };

      const cat = appState.categories.find(c => c.id === prod.categoryId);
      const isCake = isCakeCategoryObj(cat) || prod.unitType === 'pound';

      const existing = appState.cart.find(item => item.productId === productId);
      const currentQty = existing ? Number(existing.quantity || 0) : 0;
      const nextQty = currentQty + Number(deltaQty);

      if (nextQty <= 0) {
        appState.cart = appState.cart.filter(item => item.productId !== productId);
        saveState();
        return { ok: true };
      }

      if (!isCake && nextQty > Number(prod.stock || 0)) {
        return {
          ok: false,
          error: `${escapeHtml(L('Available Stock:'))} ${prod.stock} ${formatUnitLabel(prod.unitType)}`
        };
      }

      if (existing) {
        existing.quantity = nextQty;
      } else {
        appState.cart.push({ productId, quantity: nextQty });
      }

      saveState();
      return { ok: true };
    }

    function getFirstCakeCartQty() {
      for (const item of appState.cart) {
        const prod = appState.products.find(p => p.id === item.productId);
        const cat = prod ? appState.categories.find(c => c.id === prod.categoryId) : null;
        if (prod && (isCakeCategoryObj(cat) || prod.unitType === 'pound')) {
          return Number(item.quantity || 1);
        }
      }
      return 1;
    }

    function syncCakePoundWithSubtotal() {
      const poundInput = document.getElementById('checkout-cake-pound');
      if (!poundInput) return;
      const newPound = parseFloat(poundInput.value);
      if (isNaN(newPound) || newPound <= 0) return;

      for (const item of appState.cart) {
        const prod = appState.products.find(p => p.id === item.productId);
        const cat = prod ? appState.categories.find(c => c.id === prod.categoryId) : null;
        if (prod && (isCakeCategoryObj(cat) || prod.unitType === 'pound')) {
          item.quantity = newPound;
          break;
        }
      }

      let recalculatedSubtotal = 0;
      for (const item of appState.cart) {
        const prod = appState.products.find(p => p.id === item.productId);
        if (prod) recalculatedSubtotal += Number(prod.price) * Number(item.quantity);
      }

      const subEl = document.getElementById('checkout-subtotal');
      if (subEl) {
        subEl.dataset.value = String(recalculatedSubtotal);
        subEl.textContent = formatCurrency(recalculatedSubtotal);
      }
      recalculateCheckoutTotal();
    }

    function recalculateCheckoutTotal() {
      const subEl = document.getElementById('checkout-subtotal');
      const selectEl = document.getElementById('checkout-delivery-area');
      const chargeEl = document.getElementById('checkout-delivery-charge');
      const totalEl = document.getElementById('checkout-grand-total');

      if (!subEl || !selectEl || !chargeEl || !totalEl) return;
      const subtotal = parseFloat(subEl.dataset.value || '0') || 0;
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      const charge = parseFloat(selectedOption?.getAttribute('data-charge') || '0') || 0;

      chargeEl.textContent = formatCurrency(charge);
      totalEl.textContent = formatCurrency(subtotal + charge);
    }

    function adjustCartItemQty(productId, delta) {
      const res = addProductToCartWithStockCheck(productId, delta);
      if (!res.ok) {
        showToast(res.error, 'error');
        return;

      renderApp();
    }

    function removeCartItem(productId) {
      appState.cart = appState.cart.filter(item => item.productId !== productId);

    function handlePlaceCustomerOrder(e) {
      e.preventDefault();
      if (appState.cart.length === 0) {
        showToast(L('Your Cart is Empty'), 'error');
        return;
      }

      const selectEl = document.getElementById('checkout-delivery-area');
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      const deliveryArea = selectEl.value;
      const deliveryCharge = parseFloat(selectedOption?.getAttribute('data-charge') || '0') || 0;

      const customerName = document.getElementById('checkout-name').value.trim();
      const customerPhone = document.getElementById('checkout-phone').value.trim();
      const deliveryAddress = document.getElementById('checkout-address').value.trim();

      const cakePoundEl = document.getElementById('checkout-cake-pound');
      const cakeTextEl = document.getElementById('checkout-cake-text');
      const cakePounds = cakePoundEl ? parseFloat(cakePoundEl.value) : null;
      const cakeText = cakeTextEl ? cakeTextEl.value.trim() : '';

      let subtotal = 0;
      const orderItems = [];

      for (const cItem of appState.cart) {
        const prod = appState.products.find(p => p.id === cItem.productId);
        if (!prod) continue;
        const cat = appState.categories.find(c => c.id === prod.categoryId);
        const isCake = Boolean(isCakeCategoryObj(cat) || prod.unitType === 'pound');

        if (!isCake && Number(cItem.quantity) > Number(prod.stock || 0)) {
          showToast(`${escapeHtml(L('Available Stock:'))} ${prod.stock}`, 'error');
          return;
        }

        const qty = isCake && cakePounds ? cakePounds : Number(cItem.quantity);
        const lineTotal = Number(prod.price) * qty;
        subtotal += lineTotal;

        const imgs = Array.isArray(prod.images) && prod.images.length > 0 ? [...prod.images] : [DEFAULT_IMAGES.placeholder];

        orderItems.push({
          productId: prod.id,
          name: prod.name,
          image: imgs[0],
          images: imgs,
          isCake,
          unitType: prod.unitType,
          unitPrice: Number(prod.price),
          quantity: qty,
          cakePounds: isCake ? qty : null,
          cakeText: isCake ? cakeText : null,
          lineTotal
        });
      }

      for (const oItem of orderItems) {
        if (!oItem.isCake) {
          const pIdx = appState.products.findIndex(p => p.id === oItem.productId);
          if (pIdx !== -1) {
            appState.products[pIdx].stock = Math.max(0, Number(appState.products[pIdx].stock || 0) - Number(oItem.quantity));
          }
        }
      }

      const orderId = 'ORD-' + Math.floor(2000 + Math.random() * 7999);
      const totalAmount = subtotal + deliveryCharge;

      appState.orders.unshift({
        id: orderId,
        createdAt: new Date().toISOString(),
        status: 'pending',
        customerName,
        customerPhone,
        deliveryArea,
        deliveryAddress,
        deliveryCharge,
        items: orderItems,
        subtotal,
        totalAmount
      });

      appState.messages.unshift({
        id: 'MSG-' + Date.now(),
        orderId,
        customerName,
        deliveryArea,
        totalAmount,
        createdAt: new Date().toISOString(),
        text: `New Order #${orderId} from ${customerName} (${deliveryArea}) — Total ${formatCurrency(totalAmount)}.`
      });

      appState.cart = [];
      appState.activeTab.customer = 'orders';
      saveState();
      renderApp();
      showToast(`#${orderId} — ${L('Place Order')}`, 'success');
    }

              ${escapeHtml(L('Total'))}: <span class="font-num font-extrabold theme-text">${formatCurrency(order.totalAmount)}</span>
            </span>
          </div>

          ${
            viewerRole === 'shopkeeper'
              ? `<div class="pt-2.5 border-t border-slate-900/[0.06] flex flex-wrap items-center justify-between gap-2">
                  <select
                    onchange="updateOrderStatus('${order.id}', this.value)"
                    class="px-3 py-2 rounded-xl glass-input text-xs font-semibold"
                  >
                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>${escapeHtml(L('Pending'))}</option>
                    <option value="preparing" ${order.status === 'preparing' ? 'selected' : ''}>${escapeHtml(L('Preparing'))}</option>
                    <option value="out_for_delivery" ${order.status === 'out_for_delivery' ? 'selected' : ''}>${escapeHtml(L('Out for Delivery'))}</option>
                  </select>

                  <button
                    type="button"
                    onclick="completeDeliveryToTrust('${order.id}')"
                    class="px-3.5 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow-2xs flex items-center gap-1.5 transition"
                  >
                    ${ICONS.check}
                    <span>${escapeHtml(L('Complete → Trust'))}</span>
                  </button>
                </div>`
              : ''
          }
        </div>
      `;
    }

    function renderTrustOrdersList({ title, subtitle, onBack }) {
      return `
        <div class="p-4 sm:p-5 animate-view space-y-4">
          <div class="flex items-center justify-between">
            <button
              type="button"
              onclick="(${onBack.toString()})()"
              class="text-xs font-bold theme-text flex items-center gap-1"
            >
              ${ICONS.arrowLeft}
              <span>${escapeHtml(L('Menu'))}</span>
            </button>
            <span class="font-num px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-800 border border-emerald-500/25 text-xs font-bold flex items-center gap-1">
              ${ICONS.shield}
              <span>${appState.trustOrders.length}</span>
            </span>
          </div>

          <div>
            <h2 class="text-lg font-bold text-slate-900 tracking-tight">${escapeHtml(title)}</h2>
            <p class="text-xs text-slate-500">${escapeHtml(subtitle)}</p>
          </div>

          ${
            appState.trustOrders.length === 0
              ? `<div class="text-center py-14 glass-card rounded-3xl px-5">
                  <div class="w-12 h-12 rounded-2xl bg-white/75 text-slate-400 flex items-center justify-center mx-auto mb-3">
                    ${ICONS.shield}
                  </div>
                  <p class="text-sm font-bold text-slate-700">${escapeHtml(L('No completed orders in Trust'))}</p>
                  <p class="text-xs text-slate-500 mt-1">${escapeHtml(L('Completed orders automatically move here.'))}</p>
                </div>`
              : `<div class="space-y-3">
                  ${appState.trustOrders.map(order => `
                    <div class="glass-card p-4 rounded-3xl space-y-2.5">
                      <div class="flex items-center justify-between">
                        <span class="font-num text-xs font-extrabold text-slate-900">#${escapeHtml(order.id)}</span>
                        <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-800 border border-emerald-500/25 text-[11px] font-bold flex items-center gap-1">
                          ${ICONS.check}
                          <span>${escapeHtml(L('Delivered'))}</span>
                        </span>
                      </div>
                      <p class="text-xs text-slate-600">
                        <strong class="text-slate-800">${escapeHtml(L('Customer:'))}</strong> ${escapeHtml(order.customerName)} • ${escapeHtml(L(order.deliveryArea))}
                      </p>
                      <div class="text-xs text-slate-700 space-y-1.5 bg-white/70 border border-white/80 p-2.5 rounded-xl">
                        ${(order.items || []).map(it => {
                          const pUrl = resolveOrderItemPhoto(it);
                          return `
                            <div class="flex items-center justify-between gap-2">
                              <div class="flex items-center gap-2 min-w-0">
                                <img src="${pUrl}" onerror="this.src='${DEFAULT_IMAGES.placeholder}'" class="w-9 h-9 rounded-lg object-cover border border-white shrink-0" alt="${escapeAttr(L(it.name))}" />
                                <span class="truncate">${escapeHtml(L(it.name))} (<span class="font-num">${it.quantity}</span> ${escapeHtml(formatUnitLabel(it.unitType))})${it.cakeText ? ` — "${escapeHtml(it.cakeText)}"` : ''}</span>
                              </div>
                              <span class="font-num font-bold shrink-0">${formatCurrency(it.lineTotal)}</span>
                            </div>
                          `;
                        }).join('')}
                      </div>
                      <div class="pt-2 border-t border-slate-900/[0.06] flex items-center justify-between text-xs">
                        <span class="font-num text-slate-400">${formatDateTime(order.completedAt || order.createdAt)}</span>
                        <span class="font-num font-extrabold text-emerald-700">${escapeHtml(L('Total'))}: ${formatCurrency(order.totalAmount)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>`
          }
        </div>
      `;
    }

    /**
     * =========================================================================
     * UTILITIES & BOOT
     * =========================================================================
     */
    function formatDateTime(isoString) {
      try {
        return new Date(isoString).toLocaleString(appState.lang === 'bn' ? 'bn-BD' : 'en-US', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch {
        return '';
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, '&#39;');
    }

    function updateDeviceClock() {
      const clockEl = document.getElementById('device-clock');
      if (!clockEl) return;
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: false
      });
    }

    updateDeviceClock();
    setInterval(updateDeviceClock, 30000);

    updateTopSwitcherUI();
    renderApp();
    document.getElementById('switch-shopkeeper-btn')?.classList.add('hidden');
    document.getElementById('switch-customer-btn')?.classList.add('hidden');
  </script>
</body>
</html>
