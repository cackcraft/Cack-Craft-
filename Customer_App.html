    function getDefaultState() {
      return {
        lang: "bn",
        screen: "auth",
        authMode: "signup",
        rememberMe: true,
        showPassword: false,
        registeredCustomers: [],
        currentCustomerEmail: "",
        custTab: "home",
        subView: null,
        selectedCategoryFilter: "ALL",
        savedCategories: ["কেক"],
        products: [],
        orders: [],
        cart: [],
        shopSettings: {
          shopName: "",
          logo: "",
          themeColor: "#e11d48",
          address: "",
          whatsapp: "",
          hasIntroVideo: false,
          areas: []
        }
      };
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const def = getDefaultState();
          return {
            ...def,
            ...parsed,
            shopSettings: { ...def.shopSettings, ...(parsed.shopSettings || {}) }
          };
        }
      } catch (_) {}
      return getDefaultState();
    }

    let state = loadLocalState();
    let fbUser = null;
    let runtimeIntroVideoUrl = "";

    function saveLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function pubCol(name) {
      return collection(db, "artifacts", APP_ID, "public", "data", name);
    }
    function pubDoc(name, id) {
      return doc(db, "artifacts", APP_ID, "public", "data", name, id);
    }

    async function syncDocToFirestore(colName, docId, dataObj) {
      saveLocal();
      if (!fbUser) return;
      try {
        await setDoc(pubDoc(colName, docId), dataObj, { merge: true });
      } catch (err) {
        console.warn("Firestore write fallback:", err.message);
      }
    }

    async function initFirebaseSync() {
      try { await signInAnonymously(auth); } catch (_) {}

      onAuthStateChanged(auth, async (user) => {
        if (!user) return;
        fbUser = user;

        try {
          const metaSnap = await getDoc(pubDoc("shopMeta", "config"));
          if (metaSnap.exists()) {
            const d = metaSnap.data();
            if (d.shopSettings) state.shopSettings = { ...state.shopSettings, ...d.shopSettings };
            if (Array.isArray(d.savedCategories) && d.savedCategories.length > 0) {
              state.savedCategories = d.savedCategories;
            }
            saveLocal();
            render();
          }
        } catch (_) {}

        onSnapshot(pubCol("products"), (snap) => {
          const list = [];
          snap.forEach((docSnap) => list.push(docSnap.data()));
          state.products = list;
          saveLocal();
          render();
        }, () => {});

        onSnapshot(pubCol("orders"), (snap) => {
          const list = [];
          snap.forEach((docSnap) => list.push(docSnap.data()));
          state.orders = list;
          saveLocal();
          render();
        }, () => {});
      });
    }

    function openVideoDB() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (err) { reject(err); }
      });
    }

    async function loadIntroVideoBlobUrl() {
      try {
        const database = await openVideoDB();
        return new Promise((resolve) => {
          const tx = database.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get("introVideo");
          req.onsuccess = () => resolve(req.result ? URL.createObjectURL(req.result) : "");
          req.onerror = () => resolve("");
        });
      } catch (_) { return ""; }
    }

    function applyTheme() {
      const color = state.shopSettings.themeColor || "#e11d48";
      document.documentElement.style.setProperty("--theme-color", color);
      document.documentElement.style.setProperty("--theme-soft", color + "22");
    }

    function t(key) { return (I18N[state.lang] && I18N[state.lang][key]) || key; }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeWhatsAppNumber(rawPhone) {
      if (!rawPhone) return "";
      let digits = String(rawPhone).replace(/[^0-9]/g, "");
      if (digits.length === 11 && digits.startsWith("01")) digits = "88" + digits;
      return digits;
    }

    function dispatchToWhatsApp(rawPhone, text, title, desc, btnLabel) {
      const cleanNum = normalizeWhatsAppNumber(rawPhone);
      if (!cleanNum) {
        showToast(t("whatsappMissingWarning"), true);
        return;
      }
      const waUrl = `https://wa.me/${cleanNum}?text=${encodeURIComponent(text)}`;
      try {

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 700;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.76));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function handleCustomerAuthSubmit(e) {
      e.preventDefault();
      const email = (document.getElementById("auth-email")?.value || "").trim().toLowerCase();
      const password = document.getElementById("auth-pass")?.value || "";

      if (!/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email)) {
        showToast(t("gmailValidationErr"), true);
        return;
      }

      if (state.authMode === "signup") {
        const name = (document.getElementById("auth-name")?.value || "").trim();
        const confirmPass = document.getElementById("auth-confirm-pass")?.value || "";
        if (!name) return;
        if (password !== confirmPass) {
          showToast(t("passwordMismatchErr"), true);
          return;
        }
        const idx = state.registeredCustomers.findIndex(c => c.email === email);
        if (idx >= 0) {
          state.registeredCustomers[idx].name = name;
          state.registeredCustomers[idx].password = password;
        } else {
          state.registeredCustomers.push({ id: "CUST-" + Date.now(), name, email, password, phone: "", address: "", avatar: "" });
        }
        state.currentCustomerEmail = email;
      } else {
        const matched = state.registeredCustomers.find(c => c.email === email && c.password === password);
        if (!matched) {
          showToast(t("wrongCredentialsErr"), true);
          return;
        }
        state.currentCustomerEmail = matched.email;
      }

      state.custTab = "home";
      state.subView = null;
      state.screen = "intro_video";
      saveLocal();
      render();
    }

    function stepDetailQty(prodId, delta) {
      const p = state.products.find(x => x.id === prodId);
      if (!p) return;
      const isCake = p.category === "কেক";
      const inCart = state.cart.filter(c => c.productId === p.id).reduce((s, c) => s + c.qty, 0);
      const maxAllowed = isCake ? 50 : Math.max(0, p.stock - inCart);
      const next = detailQty + delta;
      if (next < 1) return;
      if (next > maxAllowed) { showToast(t("stockExceedError"), true); return; }
      detailQty = next;
      const el = document.getElementById("detail-qty");
      if (el) el.textContent = detailQty;
    }

    function addDetailToCart(prodId) {
      const p = state.products.find(x => x.id === prodId);
      if (!p) return;
      const isCake = p.category === "কেক";
      let cakeText = "";
      if (isCake) {
        cakeText = (document.getElementById("cake-text-in")?.value || "").trim();
        if (!cakeText) { showToast(t("cakeInscriptionRequired"), true); return; }
      }
      const inCart = state.cart.filter(c => c.productId === p.id).reduce((s, c) => s + c.qty, 0);
      if (!isCake && inCart + detailQty > p.stock) { showToast(t("stockExceedError"), true); return; }

      const existing = state.cart.find(c => c.productId === p.id && c.cakeText === cakeText);
      if (existing) existing.qty += detailQty;
      else state.cart.push({ productId: p.id, qty: detailQty, cakeText });

      saveLocal();
      closeModal();
      render();
      showToast(state.lang === "bn" ? "কার্টে যোগ হয়েছে!" : "Added to cart!");
    }

    function stepCartQty(idx, delta) {
      const item = state.cart[idx];
      if (!item) return;
      const prod = state.products.find(p => p.id === item.productId);
      if (!prod) return;
      const isCake = prod.category === "কেক";
      const inCart = state.cart.filter(c => c.productId === prod.id).reduce((s, c) => s + c.qty, 0);
      if (delta > 0 && !isCake && inCart + 1 > prod.stock) { showToast(t("stockExceedError"), true); return; }
      const next = item.qty + delta;
      if (next <= 0) state.cart.splice(idx, 1);
      else item.qty = next;
      saveLocal();
      render();
    }

    async function placeCustOrder() {
      const areaId = document.getElementById("co-area")?.value;
      const name = (document.getElementById("co-name")?.value || "").trim();
      const phone = (document.getElementById("co-phone")?.value || "").trim();
      const address = (document.getElementById("co-addr")?.value || "").trim();
      const areaObj = state.shopSettings.areas.find(a => a.id === areaId);

      if (!areaObj || !name || !phone || !address) {
        showToast(t("checkoutValidation"), true);
        return;
      }

      let subtotal = 0, firstPhoto = "";
      const items = [];
      for (const c of state.cart) {
        const prod = state.products.find(p => p.id === c.productId);
        if (!prod) continue;
        const img = prod.images?.[0] || "";
        if (!firstPhoto && img) firstPhoto = img;
        subtotal += prod.price * c.qty;
        items.push({ name: prod.name, category: prod.category, image: img, qty: c.qty, unit: prod.unit, price: prod.price, cakeText: c.cakeText });
        if (prod.category !== "কেক") {
          prod.stock = Math.max(0, prod.stock - c.qty);
          await syncDocToFirestore("products", prod.id, prod);
        }
      }

      const deliveryCharge = Number(areaObj.charge);
      const total = subtotal + deliveryCharge;
      const orderId = "ORD-" + Math.floor(1000 + Math.random() * 9000);
      const cust = getCurrentCustomer();
      if (cust.email) { cust.phone = phone; cust.address = address; }

      const orderObj = {
        id: orderId,
        customerEmail: cust.email || "",
        customerName: name,
        customerPhone: phone,
        area: areaObj.name,
        deliveryCharge,
        address,
        items,
        total,
        status: "pending",
        fulfillmentStage: "pending",
        time: state.lang === "bn" ? "এইমাত্র" : "Just now"
      };

      state.orders.unshift(orderObj);
      await syncDocToFirestore("orders", orderId, orderObj);

      const itemsText = items.map(i => `${i.name} (${i.qty} ${i.unit})${i.cakeText ? ` [কেকের লেখা: ${i.cakeText}]` : ""}`).join("
");
      const msgId = "MSG-" + Date.now();
      await syncDocToFirestore("messages", msgId, {
        id: msgId,
        sender: name,
        phone,
        photo: firstPhoto,
        title: `নতুন অর্ডার #${orderId} (মোট ৳${total})`,
        body: `কাস্টমার: ${name} (${phone})
এরিয়া: ${areaObj.name} (৳${deliveryCharge})
ঠিকানা: ${address}

পণ্যসমূহ:
${itemsText}`,
        time: state.lang === "bn" ? "এইমাত্র" : "Just now"
      });

      const waText =
        `🛍️ *নতুন অর্ডার (${state.shopSettings.shopName || t("brandDefault")})*
` +
        `অর্ডার আইডি: #${orderId}
` +
        `কাস্টমার: ${name}
` +
        `মোবাইল: ${phone}
` +
        `এরিয়া: ${areaObj.name}
` +
        `ঠিকানা: ${address}

` +
        `*পণ্যের বিবরণ:*
${itemsText}

` +
        `ডেলিভারি চার্জ: ৳${deliveryCharge}
` +
        `*সর্বমোট বিল: ৳${total}*`;

      state.cart = [];
      state.custTab = "orders";
      saveLocal();
      render();
      dispatchToWhatsApp(state.shopSettings.whatsapp, waText);
    }

            <div class="flex items-center gap-3 text-left">
              <div class="w-10 h-10 rounded-xl bg-theme text-white flex items-center justify-center text-lg">🏪</div>
              <div><h4 class="font-bold text-sm text-slate-900">${t("aboutShopTitle")}</h4><p class="text-xs text-slate-500">${escapeHtml(state.shopSettings.shopName)}</p></div>
            </div>
            <span class="text-slate-400 font-bold">›</span>
          </button>
          <button type="button" onclick="toggleLanguage()" class="w-full p-4 rounded-2xl bg-white border border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-3 text-left">
              <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center text-lg">🌐</div>
              <div><h4 class="font-bold text-sm text-slate-900">${t("languageTitle")}</h4><p class="text-xs text-slate-500">${state.lang === "bn" ? "বাংলা" : "English"}</p></div>
            </div>
            <span class="px-3 py-1 rounded-full bg-slate-100 text-xs font-bold">${state.lang === "bn" ? "EN" : "বাংলা"}</span>
          </button>
        </div>
      `;
    }

    function switchCustTab(tab) { state.custTab = tab; state.subView = null; saveLocal(); render(); }
    function toggleAuthMode() { state.authMode = state.authMode === "signin" ? "signup" : "signin"; render(); }
    function togglePasswordVisibility() { state.showPassword = !state.showPassword; render(); }
    function toggleRememberMe(v) { state.rememberMe = Boolean(v); saveLocal(); render(); }
    function toggleLanguage() { state.lang = state.lang === "bn" ? "en" : "bn"; saveLocal(); render(); }
    function logoutCustomer() { state.screen = "auth"; state.subView = null; state.authMode = "signin"; saveLocal(); render(); }

    Object.assign(window, {
      handleCustomerAuthSubmit, skipVideo, switchCustTab, toggleAuthMode,
      togglePasswordVisibility, toggleRememberMe, toggleLanguage, logoutCustomer,
      openProductDetail, renderDetailModal, stepDetailQty, addDetailToCart,
      askProductAbout, stepCartQty, placeCustOrder, updateCustAvatar,
      saveCustProfile, closeModal
    });

    window.addEventListener("DOMContentLoaded", async () => {
      runtimeIntroVideoUrl = await loadIntroVideoBlobUrl();
      render();
      initFirebaseSync();
    });
  </script>
</body>
</html>
