  <style>
    :root {
      --theme-color: #e11d48;
      --theme-soft: rgba(225, 29, 72, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background-color: #d8dce3;
      color: #111827;
      overflow-x: hidden;
    }

    /* Circular / Neumorphic / Glassmorphic Auth UI */
    .auth-canvas {
      min-height: 100dvh;
      background: radial-gradient(circle at 25% 20%, #f1f4f9 0%, #d8dce3 55%, #c5cbd5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      position: relative;
      overflow-x: hidden;
    }

    .auth-orb-1 {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.88), rgba(203,213,225,0.22));
      top: 5%;
      left: -65px;
      pointer-events: none;
    }

    .auth-orb-2 {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: linear-gradient(315deg, rgba(148,163,184,0.35), rgba(255,255,255,0.75));
      bottom: 4%;
      right: -70px;
      pointer-events: none;
    }

    .glass-auth-circle {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(235, 239, 245, 0.45));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 44px;
      padding: 28px 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        20px 20px 44px rgba(163, 171, 184, 0.52),
        -16px -16px 38px rgba(255, 255, 255, 0.92),
        inset 0 2px 6px rgba(255, 255, 255, 0.92);
    }

    @media (min-width: 520px) {
      .glass-auth-circle {
        max-width: 470px;
        min-height: 470px;
        border-radius: 50%;
        padding: 44px 54px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }

    .neu-input-pill {
      width: 100%;
      background: rgba(226, 231, 238, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 9999px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #18181b;
      box-shadow:
        inset 3px 3px 7px rgba(166, 174, 187, 0.55),
        inset -3px -3px 7px rgba(255, 255, 255, 0.85);
      transition: all 0.2s ease;
    }

    .neu-input-pill:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--theme-color);
      box-shadow:
        inset 2px 2px 4px rgba(166, 174, 187, 0.35),
        0 0 0 3px var(--theme-soft);
    }

    .btn-signin-dark {
      width: 100%;
      background: linear-gradient(180deg, #272b36 0%, #14161c 100%);
      color: #ffffff;
      border-radius: 9999px;
      padding: 13px 20px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 22px rgba(20, 22, 28, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-signin-dark:active {
      transform: scale(0.97);
    }

    /* Strictly Fixed Dark Frosted-Glass Floating Bottom Navigation */
    .fixed-pill-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 12px 14px 12px;
      z-index: 999;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .fixed-pill-nav-inner {
      width: 100%;
      max-width: 436px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: auto;
    }

    .nav-pill-group {
      background: rgba(24, 26, 32, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      padding: 6px;
    }

    .nav-pill-left {
      flex: 1;
      justify-content: space-around;
    }

    .nav-pill-right {
      gap: 4px;
      padding: 6px 8px;
    }

    .nav-item-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 7px;
      border-radius: 9999px;
      color: #a1a1aa;
      min-width: 52px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .nav-item-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
    }

    .nav-item-btn .nav-label {
      font-size: 10px;
      font-weight: 700;
      margin-top: 2px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .nav-badge {
      position: absolute;
      top: 2px;
      right: 5px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 9999px;
      background-color: var(--theme-color);
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #181a20;
    }

    .profile-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.25);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #27272a;
      color: #e4e4e7;
      cursor: pointer;
    }

    .profile-circle-btn.active {
      border-color: var(--theme-color);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
    }

    .bg-theme { background-color: var(--theme-color); }
    .text-theme { color: var(--theme-color); }
    .border-theme { border-color: var(--theme-color); }

    @keyframes slideDown {
      from { opacity: 0; transform: translate(-50%, -14px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .toast-banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      animation: slideDown 0.22s ease forwards;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const def = getDefaultState();
          const merged = {
            ...def,
            ...parsed,
            authBusy: false,
            shopSettings: { ...def.shopSettings, ...(parsed.shopSettings || {}) }
          };
          if (!Array.isArray(merged.savedCategories) || !merged.savedCategories.includes("কেক")) {
            merged.savedCategories = ["কেক", ...(merged.savedCategories || [])];
          }
          return merged;
        }
      } catch (_) {}
      return getDefaultState();
    }

    let state = loadLocalState();
    let fbUser = null;
    let runtimeIntroVideoUrl = "";
    let unsubProducts = null;
    let unsubOrders = null;
    let unsubMessages = null;

    function saveLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lang: state.lang,
          rememberMe: state.rememberMe,
          savedEmail: state.savedEmail,
          adminLockEmail: state.adminLockEmail,
          registeredAdmin: state.registeredAdmin,
          savedCategories: state.savedCategories,
          shopSettings: state.shopSettings
        }));
      } catch (_) {}
    }

    // Firestore Paths under /artifacts/cack-craft-1/public/data/...
    function pubCol(name) {
      return collection(db, "artifacts", APP_ID, "public", "data", name);
    }
    function pubDoc(name, id) {
      return doc(db, "artifacts", APP_ID, "public", "data", name, id);
    }

    async function syncDocToFirestore(colName, docId, dataObj) {
      saveLocal();
      if (!fbUser) return;
      try {
        await setDoc(pubDoc(colName, docId), dataObj, { merge: true });
      } catch (err) {
        console.warn("Firestore write fallback:", err.message);
      }
    }

    async function deleteDocFromFirestore(colName, docId) {
      saveLocal();
      if (!fbUser) return;
      try {
        await deleteDoc(pubDoc(colName, docId));
      } catch (err) {
        console.warn("Firestore delete fallback:", err.message);
      }
    }

    async function fetchShopMetaFromCloud() {
      try {
        const metaSnap = await getDoc(pubDoc("shopMeta", "config"));
        if (metaSnap.exists()) {
          const d = metaSnap.data();
          if (d.adminLockEmail) {
            state.adminLockEmail = String(d.adminLockEmail).trim().toLowerCase();
            state.authMode = "signin";
          }
          if (d.registeredAdmin) {
            state.registeredAdmin = { ...(state.registeredAdmin || {}), ...d.registeredAdmin };
          }
          if (d.shopSettings) {
            state.shopSettings = { ...state.shopSettings, ...d.shopSettings };
          }
          if (Array.isArray(d.savedCategories) && d.savedCategories.length > 0) {
            state.savedCategories = d.savedCategories.includes("কেক")
              ? d.savedCategories
              : ["কেক", ...d.savedCategories];
          }
          saveLocal();
          render();
        }
      } catch (_) {}
    }

    function attachRealtimeListeners() {
      if (unsubProducts) unsubProducts();
      if (unsubOrders) unsubOrders();
      if (unsubMessages) unsubMessages();

      unsubProducts = onSnapshot(pubCol("products"), (snap) => {
        const list = [];
        snap.forEach((docSnap) => list.push(docSnap.data()));
        state.products = list;
        render();
      }, () => {});

      unsubOrders = onSnapshot(pubCol("orders"), (snap) => {
        const list = [];
        snap.forEach((docSnap) => list.push(docSnap.data()));
        state.orders = list;
        render();
      }, () => {});

      unsubMessages = onSnapshot(pubCol("messages"), (snap) => {
        const list = [];
        snap.forEach((docSnap) => list.push(docSnap.data()));
        state.messages = list;
        render();
      }, () => {});
    }

    function initFirebaseSync() {
      fetchShopMetaFromCloud();

      onAuthStateChanged(auth, async (user) => {
        fbUser = user;
        if (user && user.email) {
          const email = user.email.toLowerCase();
          await fetchShopMetaFromCloud();

          if (state.adminLockEmail && state.adminLockEmail !== email) {
            await signOut(auth);
            fbUser = null;
            state.screen = "auth";
            showToast(t("adminEmailMismatchErr"), true);
            render();
            return;
          }

          if (!state.adminLockEmail) {
            state.adminLockEmail = email;
          }

          if (!state.registeredAdmin || state.registeredAdmin.email !== email) {
            state.registeredAdmin = {
              uid: user.uid,
              name: user.displayName || state.registeredAdmin?.name || email.split("@")[0],
              email,
              phone: state.registeredAdmin?.phone || "",
              avatar: state.registeredAdmin?.avatar || ""
            };
          }

          if (state.rememberMe) {
            state.savedEmail = email;
          }

          state.screen = "app";
          await syncDocToFirestore("shopMeta", "config", {
            adminLockEmail: state.adminLockEmail,
            registeredAdmin: state.registeredAdmin,
            shopSettings: state.shopSettings,
            savedCategories: state.savedCategories
          });
          attachRealtimeListeners();
          render();
        } else {
          if (unsubProducts) { unsubProducts(); unsubProducts = null; }
          if (unsubOrders) { unsubOrders(); unsubOrders = null; }
          if (unsubMessages) { unsubMessages(); unsubMessages = null; }
          state.screen = "auth";
          render();
        }
      });
    }

    function mapFirebaseAuthError(err) {
      const code = err?.code || "";
      if (code === "auth/weak-password") return t("weakPasswordErr");
      if (code === "auth/email-already-in-use") return t("emailInUseErr");
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-email") {
        return t("wrongCredentialsErr");
      }
      if (code === "auth/network-request-failed") return t("networkErr");
      if (code === "auth/operation-not-allowed") return t("authDisabledErr");
      return err?.message || t("wrongCredentialsErr");
    }

    // IndexedDB Video Helper
    function openVideoDB() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              database.createObjectStore(STORE_NAME);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (err) { reject(err); }
      });
    }

    async function saveIntroVideoBlob(file) {
      try {
        const database = await openVideoDB();
        return new Promise((resolve) => {
          const tx = database.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(file, "introVideo");
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (_) { return false; }
    }

    async function loadIntroVideoBlobUrl() {
      try {
        const database = await openVideoDB();
        return new Promise((resolve) => {
          const tx = database.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get("introVideo");
          req.onsuccess = () => resolve(req.result ? URL.createObjectURL(req.result) : "");
          req.onerror = () => resolve("");
        });
      } catch (_) { return ""; }
    }

      div.className = `toast-banner px-4 py-2.5 rounded-2xl text-xs font-bold text-white shadow-2xl flex items-center gap-2 ${

      div.innerHTML = `<span>${isError ? "⚠️" : "✅"}</span><span>${escapeHtml(msg)}</span>`;
      container.innerHTML = "";
      container.appendChild(div);
      setTimeout(() => { if (container.contains(div)) div.remove(); }, 3800);
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 700;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.76));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleAdminResetPassword() {
      const email = (document.getElementById("auth-email")?.value || state.adminLockEmail || "").trim().toLowerCase();
      if (!/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email)) {
        showToast(t("enterGmailForReset"), true);
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showToast(t("resetEmailSent"));
      } catch (err) {
        showToast(mapFirebaseAuthError(err), true);
      }
    }

    async function handleAdminAuthSubmit(e) {
      e.preventDefault();
      if (state.authBusy) return;

      const isLocked = Boolean(state.adminLockEmail);
      const effectiveMode = isLocked ? "signin" : state.authMode;
      const email = (document.getElementById("auth-email")?.value || "").trim().toLowerCase();
      const password = document.getElementById("auth-pass")?.value || "";

      if (!/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email)) {
        showToast(t("gmailValidationErr"), true);
        return;
      }

      if (password.length < 6) {
        showToast(t("weakPasswordErr"), true);
        return;
      }

      if (state.adminLockEmail && email !== state.adminLockEmail) {
        showToast(t("adminEmailMismatchErr"), true);
        return;
      }

      state.authBusy = true;
      render();

      try {
        if (effectiveMode === "signup") {
          const name = (document.getElementById("auth-name")?.value || "").trim();
          const confirmPass = document.getElementById("auth-confirm-pass")?.value || "";
          if (!name) {
            state.authBusy = false;
            render();
            return;
          }
          if (password !== confirmPass) {
            state.authBusy = false;
            render();
            showToast(t("passwordMismatchErr"), true);
            return;
          }

          const cred = await createUserWithEmailAndPassword(auth, email, password);
          fbUser = cred.user;
          state.adminLockEmail = email;
          state.registeredAdmin = { uid: cred.user.uid, name, email, phone: "", avatar: "" };
        } else {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          fbUser = cred.user;
          if (!state.adminLockEmail) state.adminLockEmail = email;
          if (!state.registeredAdmin || state.registeredAdmin.email !== email) {
            state.registeredAdmin = {
              uid: cred.user.uid,
              name: email.split("@")[0],
              email,
              phone: state.registeredAdmin?.phone || "",
              avatar: state.registeredAdmin?.avatar || ""
            };
          }
        }

        if (state.rememberMe) state.savedEmail = email;
        state.shopTab = "home";
        state.subView = null;
        state.authBusy = false;
        state.screen = "app";

        await syncDocToFirestore("shopMeta", "config", {
          adminLockEmail: state.adminLockEmail,
          registeredAdmin: state.registeredAdmin,
          shopSettings: state.shopSettings,
          savedCategories: state.savedCategories
        });
        attachRealtimeListeners();
        render();
      } catch (err) {
        state.authBusy = false;
        render();
        showToast(mapFirebaseAuthError(err), true);
      }
    }

          <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
            <span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full">✓ Seen & Auto-Deleted</span>

          </div>
          ${msg.photo ? `<img src="${msg.photo}" class="w-full h-44 object-cover rounded-2xl border" />` : ""}
          <h4 class="font-extrabold text-sm text-slate-900">${escapeHtml(msg.title)}</h4>
          <p class="text-xs text-slate-600"><b>${escapeHtml(msg.sender)}</b> (${escapeHtml(msg.phone)})</p>
          <p class="text-xs text-slate-700 whitespace-pre-line bg-slate-50 p-3 rounded-2xl">${escapeHtml(msg.body)}</p>
          <button type="button" onclick="closeModal()" class="w-full py-3 rounded-xl bg-theme text-white font-bold text-xs">ঠিক আছে</button>

    function getStageBadge(stage) {
      if (stage === "processing") return `<span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800">⚙️ ${t("statusProcessing")}</span>`;
      if (stage === "out_for_delivery") return `<span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800">🚚 ${t("statusOutForDelivery")}</span>`;
      return `<span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800">⏳ ${t("statusPending")}</span>`;
    }

    function renderOrders() {
      const activeOrders = state.orders.filter(o => o.status === "pending");
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="font-extrabold text-base text-slate-900">${t("activeOrders")} (${activeOrders.length})</h2>
            <span class="text-[10px] text-slate-500">${t("tapPhotoToZoom")}</span>
          </div>
          ${activeOrders.length === 0 ? `
            <div class="text-center py-20 text-slate-400">
              <div class="text-4xl mb-2 opacity-40">📦</div>
              <p class="text-sm font-bold text-slate-600">${t("noActiveOrders")}</p>
            </div>
          ` : activeOrders.map(ord => {
            const stage = ord.fulfillmentStage || "pending";
            return `
              <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-slate-100 text-slate-800">#${escapeHtml(ord.id)}</span>
                      ${getStageBadge(stage)}
                    </div>
                    <h4 class="font-extrabold text-sm text-slate-900 mt-1">${escapeHtml(ord.customerName)}</h4>
                  </div>
                  <div class="text-right">
                    <span class="text-base font-extrabold text-theme">৳${ord.total}</span>
                    <p class="text-[10px] text-slate-400">${escapeHtml(ord.time)}</p>
                  </div>
                </div>

                <div class="bg-slate-50 p-2.5 rounded-2xl space-y-2">
                  ${ord.items.map(it => `
                    <div class="flex items-center gap-3 bg-white p-2 rounded-xl border border-slate-200/80">
                      ${it.image ? `<img src="${it.image}" onclick="openPhotoLightbox('${it.image}', '${escapeHtml(it.name)}')" class="w-16 h-16 rounded-xl object-cover border shrink-0 cursor-zoom-in" />` : `<div class="w-16 h-16 rounded-xl bg-slate-100 flex items-center justify-center text-2xl shrink-0">🧁</div>`}
                      <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between gap-1">
                          <h5 class="font-extrabold text-xs text-slate-900">${escapeHtml(it.name)}</h5>
                          <span class="font-extrabold text-xs text-theme shrink-0">৳${it.price * it.qty}</span>
                        </div>
                        <p class="text-[11px] text-slate-600 mt-0.5">${escapeHtml(it.category || "")} • <b>${it.qty} ${escapeHtml(it.unit)}</b></p>
                        ${it.cakeText ? `<p class="text-[11px] text-rose-600 font-bold mt-1 bg-rose-50 px-2 py-0.5 rounded-md inline-block">🎂 "${escapeHtml(it.cakeText)}"</p>` : ""}
                      </div>
                    </div>
                  `).join("")}
                </div>

                <div class="text-xs text-slate-600 space-y-1 px-1">
                  <p>📞 <b>ফোন:</b> ${escapeHtml(ord.customerPhone)}</p>
                  <p>📍 <b>এরিয়া:</b> ${escapeHtml(ord.area)} (চার্জ: ৳${ord.deliveryCharge})</p>
                  <p>🏠 <b>ঠিকানা:</b> ${escapeHtml(ord.address)}</p>
                </div>

                <div class="space-y-2 pt-1">
                  <div class="grid grid-cols-3 gap-1.5">
                    <button type="button" onclick="updateOrderStage('${ord.id}', 'pending')" class="py-2 px-1.5 rounded-xl text-[10px] font-extrabold border ${stage === "pending" ? "bg-amber-500 text-white border-amber-500" : "bg-amber-50 text-amber-800 border-amber-200"}">⏳ ${t("statusPending")}</button>
                    <button type="button" onclick="updateOrderStage('${ord.id}', 'processing')" class="py-2 px-1.5 rounded-xl text-[10px] font-extrabold border ${stage === "processing" ? "bg-blue-600 text-white border-blue-600" : "bg-blue-50 text-blue-800 border-blue-200"}">⚙️ ${t("statusProcessing")}</button>
                    <button type="button" onclick="updateOrderStage('${ord.id}', 'out_for_delivery')" class="py-2 px-1.5 rounded-xl text-[10px] font-extrabold border ${stage === "out_for_delivery" ? "bg-purple-600 text-white border-purple-600" : "bg-purple-50 text-purple-800 border-purple-200"}">🚚 ${state.lang === "bn" ? "বের হয়েছে" : "Out Delivery"}</button>
                  </div>
                  <button type="button" onclick="confirmOrderToTrust('${ord.id}')" class="w-full py-3 rounded-xl bg-theme text-white font-bold text-xs shadow-md">
                    ✓ ${t("confirmOrderBtn")} (${t("trustTitle")})
                  </button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    async function updateOrderStage(orderId, stage) {
      const target = state.orders.find(o => o.id === orderId);
      if (!target) return;
      target.fulfillmentStage = stage;
      await syncDocToFirestore("orders", orderId, target);
      render();
      showToast(t("orderStatusUpdated"));
    }

    async function confirmOrderToTrust(orderId) {
      const target = state.orders.find(o => o.id === orderId);
      if (!target) return;
      target.status = "trust";
      target.fulfillmentStage = "confirmed";
      await syncDocToFirestore("orders", orderId, target);
      render();
      showToast(t("orderConfirmedMoved"));
    }

    function openPhotoLightbox(imgSrc, caption) {
      openModal(`
        <div class="p-4 bg-zinc-950 text-white space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-sm truncate">${escapeHtml(caption)}</h4>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/15 font-bold">✕</button>
          </div>
          <img src="${imgSrc}" class="w-full max-h-[72vh] object-contain rounded-2xl bg-black" />
        </div>
      `);
    }

    function renderHome() {
      return `
        <div>
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-extrabold text-base text-slate-900">${t("navHome")} (${state.products.length})</h2>
          </div>
          ${state.products.length === 0 ? `
            <div class="text-center py-20 px-4 bg-white rounded-3xl border border-dashed border-slate-300">
              <div class="text-5xl mb-3">🍰</div>
              <h3 class="font-extrabold text-sm text-slate-800">${t("noProductsYet")}</h3>
              <p class="text-xs text-slate-500 mt-1">${t("noProductsShopHint")}</p>
            </div>
          ` : `
            <div class="grid grid-cols-2 gap-3">
              ${state.products.map(p => `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col">
                  <div class="relative h-32 bg-slate-100">
                    ${p.images?.[0] ? `<img src="${p.images[0]}" class="w-full h-full object-cover" />` : `<div class="w-full h-full flex items-center justify-center text-3xl">🧁</div>`}
                    <span class="absolute top-2 left-2 px-2 py-0.5 rounded-md bg-black/65 text-white text-[10px] font-semibold">${escapeHtml(p.category)}</span>
                  </div>
                  <div class="p-2.5 flex-1 flex flex-col justify-between">
                    <div>
                      <h3 class="font-bold text-xs text-slate-900 line-clamp-1">${escapeHtml(p.name)}</h3>
                      <p class="text-sm font-extrabold text-theme mt-0.5">৳${p.price} <span class="text-[10px] font-normal text-slate-500">/ ${escapeHtml(p.unit)}</span></p>
                      ${p.category !== "কেক" ? `<p class="text-[10px] text-slate-500 mt-0.5">${t("inStock")}: <b>${p.stock}</b> ${escapeHtml(p.unit)}</p>` : ""}
                    </div>
                    <div class="flex gap-1.5 mt-2.5 pt-2 border-t border-slate-100">
                      <button type="button" onclick="openProductModal('${p.id}')" class="flex-1 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-[11px] font-bold flex items-center justify-center gap-1">
                        <i data-lucide="edit-3" class="w-3 h-3"></i> এডিট
                      </button>
                      <button type="button" onclick="removeProduct('${p.id}')" class="p-1.5 rounded-lg bg-red-50 text-red-600">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          `}

          <button type="button" onclick="openProductModal(null)"
            style="position:fixed;bottom:86px;right:max(18px,calc(50% - 212px));z-index:900;"
            class="w-14 h-14 rounded-full bg-theme text-white shadow-2xl flex items-center justify-center active:scale-90 transition">
            <i data-lucide="plus" class="w-7 h-7"></i>
          </button>
        </div>
      `;
    }

    async function removeProduct(id) {
      state.products = state.products.filter(p => p.id !== id);
      await deleteDocFromFirestore("products", id);
      render();
    }

    let tempModalImages = [], tempSelectedCategory = "কেক", tempSelectedUnit = "পাউন্ড", tempEditingProductId = "";

    function openProductModal(productId) {
      const existing = productId ? state.products.find(p => p.id === productId) : null;
      tempEditingProductId = existing ? existing.id : "";
      tempModalImages = existing?.images ? [...existing.images] : [];
      tempSelectedCategory = existing ? existing.category : "কেক";
      tempSelectedUnit = existing ? existing.unit : (tempSelectedCategory === "কেক" ? "পাউন্ড" : "পিস");
      renderProductFormModal(existing);
    }

    function renderProductFormModal(existing) {
      const isCake = tempSelectedCategory === "কেক";
      openModal(`
        <div class="p-5 space-y-3.5 max-h-[88vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <h3 class="font-extrabold text-base text-slate-900">${tempEditingProductId ? t("editProductTitle") : t("addProductTitle")}</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
          </div>
          <form onsubmit="saveProductForm(event)" class="space-y-3.5">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">${t("uploadPhotos")}</label>
              <div class="flex items-center gap-2 overflow-x-auto pb-1">
                <label class="w-16 h-16 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-500 cursor-pointer shrink-0">
                  <span class="text-lg">📷</span>
                  <span class="text-[9px] font-bold">+ ছবি</span>
                  <input type="file" accept="image/*" multiple onchange="handleProductImagesSelect(event)" class="hidden" />
                </label>
                ${tempModalImages.map((img, idx) => `
                  <div class="relative w-16 h-16 rounded-2xl overflow-hidden border shrink-0">
                    <img src="${img}" class="w-full h-full object-cover" />
                    <button type="button" onclick="removeModalImage(${idx})" class="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-red-600 text-white text-[10px] font-bold">✕</button>
                  </div>
                `).join("")}
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("productName")} *</label>
              <input id="prod-name" type="text" required value="${existing ? escapeHtml(existing.name) : ""}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
            </div>

            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2.5">
              <label class="block text-xs font-bold text-slate-800">${t("selectCategory")} *</label>
              <div class="flex flex-wrap gap-1.5">
                ${state.savedCategories.map(cat => `
                  <button type="button" onclick="selectFormCategory('${escapeHtml(cat)}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border ${tempSelectedCategory === cat ? "bg-theme text-white border-transparent" : "bg-white text-slate-700 border-slate-200"}">
                    ${cat === "কেক" ? "🎂 কেক" : escapeHtml(cat)}
                  </button>
                `).join("")}
              </div>
              <div class="flex gap-1.5 pt-1">
                <input id="new-cat-input" type="text" placeholder="${t("newCategoryPlaceholder")}" class="flex-1 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs" />
                <button type="button" onclick="addPersistentCategory()" class="px-3 py-2 rounded-xl bg-zinc-900 text-white text-xs font-bold">+ ${t("addCategoryBtn")}</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">${t("priceLabel")} *</label>
                <input id="prod-price" type="number" required min="1" value="${existing ? existing.price : ""}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">${t("unitLabel")}</label>
                ${isCake ? `<div class="w-full px-3 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-extrabold text-rose-700">${t("unitPound")}</div>` : `
                  <select id="prod-unit" onchange="tempSelectedUnit = this.value" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold">
                    <option value="পিস" ${tempSelectedUnit === "পিস" ? "selected" : ""}>${t("unitPiece")}</option>
                    <option value="গ্রাম" ${tempSelectedUnit === "গ্রাম" ? "selected" : ""}>${t("unitGram")}</option>
                  </select>
                `}
              </div>
            </div>

            ${!isCake ? `
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">${t("stockLabel")} (${escapeHtml(tempSelectedUnit)}) *</label>
                <input id="prod-stock" type="number" required min="0" value="${existing ? existing.stock : 1}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
              </div>
            ` : `<p class="text-[11px] text-rose-600 font-semibold bg-rose-50 px-3 py-2 rounded-xl">ℹ️ ${t("cakePoundNote")}</p>`}

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("productDesc")}</label>
              <textarea id="prod-desc" rows="2" class="w-full px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs">${existing?.desc ? escapeHtml(existing.desc) : ""}</textarea>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-theme text-white font-extrabold text-sm shadow-lg">${t("saveProductBtn")}</button>
          </form>
        </div>
      `);
    }

    function preserveFormDraft() {
      return {
        name: document.getElementById("prod-name")?.value || "",
        price: document.getElementById("prod-price")?.value || "",
        desc: document.getElementById("prod-desc")?.value || "",
        stock: Number(document.getElementById("prod-stock")?.value ?? 1)
      };
    }

    function selectFormCategory(cat) {
      const draft = preserveFormDraft();
      tempSelectedCategory = cat;
      tempSelectedUnit = cat === "কেক" ? "পাউন্ড" : "পিস";
      renderProductFormModal(draft);
    }

    async function addPersistentCategory() {
      const val = (document.getElementById("new-cat-input")?.value || "").trim();
      if (!val) return;
      if (!state.savedCategories.includes(val)) {
        state.savedCategories.push(val);
        await syncDocToFirestore("shopMeta", "config", { savedCategories: state.savedCategories });
      }
      selectFormCategory(val);
    }

    async function handleProductImagesSelect(e) {
      const files = Array.from(e.target.files || []);
      const draft = preserveFormDraft();
      for (const f of files) tempModalImages.push(await compressImageFile(f));
      renderProductFormModal(draft);
    }

    function removeModalImage(idx) {
      const draft = preserveFormDraft();
      tempModalImages.splice(idx, 1);
      renderProductFormModal(draft);
    }

    async function saveProductForm(e) {
      e.preventDefault();
      const name = document.getElementById("prod-name").value.trim();
      const price = Number(document.getElementById("prod-price").value);
      const desc = document.getElementById("prod-desc").value.trim();
      const isCake = tempSelectedCategory === "কেক";
      const unit = isCake ? "পাউন্ড" : (document.getElementById("prod-unit")?.value || "পিস");
      const stock = isCake ? 9999 : Number(document.getElementById("prod-stock")?.value || 0);

      const id = tempEditingProductId || ("prod-" + Date.now());
      const obj = { id, name, category: tempSelectedCategory, price, unit, stock, desc, images: [...tempModalImages] };

      if (tempEditingProductId) {
        state.products = state.products.map(p => p.id === id ? obj : p);
      } else {
        state.products.unshift(obj);
      }
      await syncDocToFirestore("products", id, obj);
      closeModal();
      render();
    }

    function renderProfile() {
      const admin = state.registeredAdmin || { name: "", email: "", phone: "", avatar: "" };
      return `
        <div class="space-y-4">
          <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs text-center">
            <div class="relative w-24 h-24 mx-auto">
              <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-theme bg-slate-100 flex items-center justify-center">
                ${admin.avatar ? `<img src="${admin.avatar}" class="w-full h-full object-cover" />` : `<span class="text-4xl">👤</span>`}
              </div>
              <label class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-theme text-white flex items-center justify-center cursor-pointer shadow">
                <i data-lucide="camera" class="w-4 h-4"></i>
                <input type="file" accept="image/*" onchange="updateAdminAvatar(event)" class="hidden" />
              </label>
            </div>
            <h3 class="font-extrabold text-base text-slate-900 mt-3">${escapeHtml(admin.name || t("shopkeeperRole"))}</h3>
            <p class="text-xs text-slate-500 font-semibold">🔒 ${escapeHtml(admin.email)}</p>
          </div>

          <form onsubmit="saveAdminProfile(event)" class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("nameLabel")}</label>
              <input id="sk-name" type="text" value="${escapeHtml(admin.name)}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("gmailLabel")} (Locked)</label>
              <input type="email" disabled value="${escapeHtml(admin.email)}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-sm text-slate-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("phoneLabel")}</label>
              <input id="sk-phone" type="tel" value="${escapeHtml(admin.phone || "")}" placeholder="01XXXXXXXXX" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-theme text-white font-bold text-xs shadow">${t("updateProfileBtn")}</button>
          </form>

          <button type="button" onclick="logoutShopkeeper()" class="w-full py-3 rounded-2xl bg-red-50 text-red-600 border border-red-200 font-bold text-xs">
            🚪 ${t("logoutBtn")}
          </button>
        </div>
      `;
    }

    async function updateAdminAvatar(e) {
      const file = e.target.files?.[0];
      if (!file || !state.registeredAdmin) return;
      state.registeredAdmin.avatar = await compressImageFile(file);
      await syncDocToFirestore("shopMeta", "config", { registeredAdmin: state.registeredAdmin });
      render();
    }

    async function saveAdminProfile(e) {
      e.preventDefault();
      if (!state.registeredAdmin) return;
      state.registeredAdmin.name = document.getElementById("sk-name").value.trim();
      state.registeredAdmin.phone = document.getElementById("sk-phone").value.trim();
      await syncDocToFirestore("shopMeta", "config", { registeredAdmin: state.registeredAdmin });
      render();
      showToast(state.lang === "bn" ? "প্রোফাইল আপডেট হয়েছে!" : "Profile updated!");
    }

      if (state.subView === "trust") return renderTrustOrders();
      if (state.subView === "settings") return renderSettings();
      const trustCount = state.orders.filter(o => o.status === "trust").length;

      return `
        <div class="space-y-3">
          <h2 class="font-extrabold text-base text-slate-900">${t("menuTitle")}</h2>
          <button type="button" onclick="state.subView='trust'; render();" class="w-full p-4 rounded-2xl bg-white border border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-3 text-left">
              <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg">🛡️</div>
              <div>
                <h4 class="font-bold text-sm text-slate-900">${t("trustTitle")}</h4>
                <p class="text-xs text-slate-500">${trustCount}</p>
              </div>
            </div>
            <span class="text-slate-400 font-bold">›</span>
          </button>
          <button type="button" onclick="state.subView='settings'; render();" class="w-full p-4 rounded-2xl bg-white border border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-3 text-left">
              <div class="w-10 h-10 rounded-xl bg-theme text-white flex items-center justify-center text-lg">⚙️</div>
              <div>
                <h4 class="font-bold text-sm text-slate-900">${t("settingsTitle")}</h4>
                <p class="text-xs text-slate-500">লোগো, নাম, ঠিকানা, WhatsApp, এরিয়া, ভিডিও ও থিম</p>
              </div>
            </div>
            <span class="text-slate-400 font-bold">›</span>
          </button>
          <button type="button" onclick="toggleLanguage()" class="w-full p-4 rounded-2xl bg-white border border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-3 text-left">
              <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center text-lg">🌐</div>
              <div>
                <h4 class="font-bold text-sm text-slate-900">${t("languageTitle")}</h4>
                <p class="text-xs text-slate-500">${state.lang === "bn" ? "বাংলা" : "English"}</p>
              </div>
            </div>
            <span class="px-3 py-1 rounded-full bg-slate-100 text-xs font-bold">${state.lang === "bn" ? "EN" : "বাংলা"}</span>
          </button>
        </div>
      `;
    }

    function renderSettings() {
      const s = state.shopSettings;
      return `
        <div class="space-y-4">
          <h2 class="font-extrabold text-base text-slate-900">${t("settingsTitle")}</h2>

          <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <div class="flex items-center gap-3">
              <div class="w-16 h-16 rounded-2xl bg-slate-100 border overflow-hidden flex items-center justify-center shrink-0">
                ${s.logo ? `<img src="${s.logo}" class="w-full h-full object-cover" />` : `<span class="text-2xl">🎂</span>`}
              </div>
              <label class="px-3.5 py-2 rounded-xl bg-theme text-white text-xs font-bold cursor-pointer">
                📷 ${t("shopLogoLabel")}
                <input type="file" accept="image/*" onchange="handleShopLogoUpload(event)" class="hidden" />
              </label>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("shopNameLabel")}</label>
              <input id="set-shop-name" type="text" value="${escapeHtml(s.shopName)}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("shopAddressLabel")}</label>
              <input id="set-shop-addr" type="text" value="${escapeHtml(s.address)}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">${t("whatsappLabel")}</label>
              <input id="set-shop-wa" type="tel" value="${escapeHtml(s.whatsapp)}" placeholder="01XXXXXXXXX" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-700 mb-2">${t("themeColorLabel")}</label>
            <div class="flex items-center gap-2.5 flex-wrap">
              ${THEME_COLORS.map(c => `
                <button type="button" onclick="selectThemeColor('${c}')" style="background-color:${c};"
                  class="w-9 h-9 rounded-full text-white font-bold flex items-center justify-center shadow ${s.themeColor === c ? "ring-4 ring-slate-300 scale-110" : ""}">
                  ${s.themeColor === c ? "✓" : ""}
                </button>
              `).join("")}
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
            <label class="block text-xs font-bold text-slate-700">${t("introVideoLabel")}</label>
            <label class="w-full py-2.5 px-3 rounded-xl border-2 border-dashed border-slate-300 text-xs font-bold text-slate-700 flex items-center justify-center gap-2 cursor-pointer">
              🎬 ${t("introVideoLabel")}
              <input type="file" accept="video/*" onchange="handleIntroVideoUpload(event)" class="hidden" />
            </label>
            ${runtimeIntroVideoUrl ? `<video src="${runtimeIntroVideoUrl}" controls class="w-full h-32 rounded-xl bg-black object-cover"></video>` : ""}
          </div>

          <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <label class="block text-xs font-bold text-slate-700">${t("deliveryAreasLabel")}</label>
            <div class="flex gap-1.5">
              <input id="area-name-in" type="text" placeholder="${t("areaNamePlaceholder")}" class="flex-1 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs" />
              <input id="area-fee-in" type="number" placeholder="${t("areaChargePlaceholder")}" class="w-20 px-2.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs" />
              <button type="button" onclick="addArea()" class="px-3 py-2 rounded-xl bg-theme text-white text-xs font-bold">+ ${t("addCategoryBtn")}</button>
            </div>
            <div class="space-y-1.5">
              ${s.areas.map(a => `
                <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl text-xs">
                  <span class="font-bold text-slate-800">${escapeHtml(a.name)}</span>
                  <div class="flex items-center gap-2">
                    <span class="font-extrabold text-theme">৳${a.charge}</span>
                    <button type="button" onclick="removeArea('${a.id}')" class="text-red-500">✕</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <button type="button" onclick="saveSettingsBtn()" class="w-full py-3.5 rounded-2xl bg-theme text-white font-extrabold text-sm shadow-lg">${t("saveSettingsBtn")}</button>
        </div>
      `;
    }

    async function handleShopLogoUpload(e) {
      const f = e.target.files?.[0];
      if (!f) return;
      state.shopSettings.logo = await compressImageFile(f);
      await syncDocToFirestore("shopMeta", "config", { shopSettings: state.shopSettings });
      render();
    }

    async function handleIntroVideoUpload(e) {
      const f = e.target.files?.[0];
      if (!f) return;
      await saveIntroVideoBlob(f);
      runtimeIntroVideoUrl = URL.createObjectURL(f);
      state.shopSettings.hasIntroVideo = true;
      await syncDocToFirestore("shopMeta", "config", { shopSettings: state.shopSettings });
      render();
    }

    async function selectThemeColor(c) {
      state.shopSettings.themeColor = c;
      await syncDocToFirestore("shopMeta", "config", { shopSettings: state.shopSettings });
      render();
    }

    async function addArea() {
      const name = (document.getElementById("area-name-in")?.value || "").trim();
      const charge = Number(document.getElementById("area-fee-in")?.value);
      if (!name || isNaN(charge)) return;
      state.shopSettings.areas.push({ id: "area-" + Date.now(), name, charge });
      await syncDocToFirestore("shopMeta", "config", { shopSettings: state.shopSettings });
      render();
    }

    async function removeArea(id) {
      state.shopSettings.areas = state.shopSettings.areas.filter(a => a.id !== id);
      await syncDocToFirestore("shopMeta", "config", { shopSettings: state.shopSettings });
      render();
    }

    async function saveSettingsBtn() {
      state.shopSettings.shopName = (document.getElementById("set-shop-name")?.value || "").trim();
      state.shopSettings.address = (document.getElementById("set-shop-addr")?.value || "").trim();
      state.shopSettings.whatsapp = (document.getElementById("set-shop-wa")?.value || "").trim();
      await syncDocToFirestore("shopMeta", "config", { shopSettings: state.shopSettings });
      render();
      showToast(state.lang === "bn" ? "সেটিংস সেভ হয়েছে!" : "Settings saved!");
    }

    function renderTrustOrders() {
      const trustList = state.orders.filter(o => o.status === "trust");
      return `
        <div class="space-y-3">
          <h2 class="font-extrabold text-base text-slate-900">🛡️ ${t("trustTitle")} (${trustList.length})</h2>
          ${trustList.length === 0 ? `
            <div class="text-center py-20 text-slate-400">
              <div class="text-4xl mb-2 opacity-40">🛡️</div>
              <p class="text-sm font-bold text-slate-600">${t("noTrustOrders")}</p>
            </div>
          ` : trustList.map(ord => `
            <div class="bg-white p-4 rounded-2xl border-l-4 border-emerald-500 shadow-xs space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full">✓ ${t("trustBadge")} (#${escapeHtml(ord.id)})</span>
                <span class="font-extrabold text-sm text-theme">৳${ord.total}</span>
              </div>
              <p class="text-xs font-bold text-slate-800">${escapeHtml(ord.customerName)} (${escapeHtml(ord.customerPhone)})</p>
              <div class="space-y-1.5">
                ${ord.items.map(it => `
                  <div class="flex items-center gap-2.5 bg-slate-50 p-2 rounded-xl">
                    ${it.image ? `<img src="${it.image}" onclick="openPhotoLightbox('${it.image}', '${escapeHtml(it.name)}')" class="w-12 h-12 rounded-lg object-cover shrink-0 cursor-zoom-in" />` : ""}
                    <div class="text-xs text-slate-700">
                      <p class="font-bold text-slate-900">${escapeHtml(it.name)} × ${it.qty} ${escapeHtml(it.unit)}</p>
                      ${it.cakeText ? `<span class="text-rose-600 text-[11px] font-semibold">🎂 "${escapeHtml(it.cakeText)}"</span>` : ""}
                    </div>
                  </div>
                `).join("")}
              </div>
              <p class="text-[11px] text-slate-400">${escapeHtml(ord.area)} — ${escapeHtml(ord.address)}</p>
            </div>
          `).join("")}
        </div>
      `;
    }

    function switchShopTab(tab) { state.shopTab = tab; state.subView = null; saveLocal(); render(); }
    function toggleAuthMode() { if (state.adminLockEmail) { showToast(t("adminAlreadyLockedMsg"), true); return; } state.authMode = state.authMode === "signin" ? "signup" : "signin"; render(); }
    function togglePasswordVisibility() { state.showPassword = !state.showPassword; render(); }
    function toggleRememberMe(v) { state.rememberMe = Boolean(v); saveLocal(); render(); }
    function toggleLanguage() { state.lang = state.lang === "bn" ? "en" : "bn"; saveLocal(); render(); }
    async function logoutShopkeeper() {
      try { await signOut(auth); } catch (_) {}
      fbUser = null;
      state.screen = "auth";
      state.subView = null;
      state.authMode = "signin";
      saveLocal();
      render();
    }

    Object.assign(window, {
      handleAdminAuthSubmit, handleAdminResetPassword, switchShopTab, toggleAuthMode,
      togglePasswordVisibility, toggleRememberMe, toggleLanguage, logoutShopkeeper,
      openAndDeleteMessage, updateOrderStage, confirmOrderToTrust, openPhotoLightbox,
      openProductModal, removeProduct, selectFormCategory, addPersistentCategory,
      handleProductImagesSelect, removeModalImage, saveProductForm, updateAdminAvatar,
      saveAdminProfile, handleShopLogoUpload, handleIntroVideoUpload, selectThemeColor,
      addArea, removeArea, saveSettingsBtn, closeModal
    });

    window.addEventListener("DOMContentLoaded", async () => {
      runtimeIntroVideoUrl = await loadIntroVideoBlobUrl();
      render();
      initFirebaseSync();
    });
  </script>
</body>
</html>
